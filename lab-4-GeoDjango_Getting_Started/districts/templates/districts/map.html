{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Districts from PostGIS</title>
   <link rel="stylesheet"
         href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
   <link rel="stylesheet" href="{% static 'districts/style.css' %}">
</head>
<body>

<header>
   <img class="logo" src="{% static 'districts/nust.jpg' %}" alt="NUST logo: Defining futures">
   <div class="titles">
      <h1>Districts from PostGIS</h1>
      <p class="subtitle">Served by Django from a spatial database</p>
   </div>
</header>

<div id="panel">
   <div class="field">
      <label for="province">Province</label>
      <select id="province">
         <option value="">All provinces</option>
      </select>
   </div>
   <span id="count">loading...</span>
   <span class="hint">Click a district: PostGIS says which one it is</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
   const DISTRICTS_URL = "{% url 'districts-geojson' %}";
   const WHERE_URL = "{% url 'district-at' %}";

   const map = L.map('map', {
      maxBounds: [[21.5, 58.5], [39.0, 80.5]],
      maxBoundsViscosity: 1.0,
      minZoom: 5
   }).setView([30.3753, 69.3451], 5);

   L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
   }).addTo(map);

   const colours = {
      'Punjab': '#1b9e77', 'Sindh': '#d95f02', 'Khyber Pakhtunkhwa': '#7570b3',
      'Balochistan': '#e7298a', 'Islamabad': '#66a61e',
      'Azad Kashmir': '#e6ab02', 'Gilgit Baltistan': '#a6761d'
   };

   function show(value) {
      return value === null || value === undefined
         ? 'not recorded' : value.toLocaleString();
   }

   // the province colours as a legend, bottom left
   const legend = L.control({ position: 'bottomleft' });
   legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<h4>Province</h4>' + Object.keys(colours).map(function (name) {
         return '<i style="background:' + colours[name] + '"></i>' + name;
      }).join('<br>');
      return div;
   };
   legend.addTo(map);

   let districtLayer = null;

   // province = "" loads everything; otherwise PostGIS does the filtering:
   // /api/districts/?province=Sindh returns only that province
   async function loadDistricts(province) {
      const url = province
         ? DISTRICTS_URL + '?province=' + encodeURIComponent(province)
         : DISTRICTS_URL;
      const response = await fetch(url);
      if (!response.ok) {
         console.error('Request failed with status', response.status);
         return;
      }
      const data = await response.json();

      if (districtLayer) { map.removeLayer(districtLayer); }
      districtLayer = L.geoJSON(data, {
         style: function (feature) {
            return {
               color: '#ffffff',
               weight: 1,
               fillColor: colours[feature.properties.province] || '#888888',
               fillOpacity: 0.7
            };
         },
         onEachFeature: function (feature, featureLayer) {
            const p = feature.properties;
            featureLayer.bindTooltip(p.name + ', ' + p.province, { sticky: true });
         }
      }).addTo(map);

      map.fitBounds(districtLayer.getBounds());
      document.getElementById('count').textContent =
         data.features.length + ' districts';
   }

   // the drop-down lists the provinces and reloads the map from the database
   const provinceSelect = document.getElementById('province');
   Object.keys(colours).sort().forEach(function (name) {
      provinceSelect.add(new Option(name, name));
   });
   provinceSelect.addEventListener('change', function () {
      loadDistricts(provinceSelect.value);
   });

   loadDistricts("");

   map.on('click', async function (e) {
      const url = WHERE_URL + '?lat=' + e.latlng.lat + '&lng=' + e.latlng.lng;
      const answer = await (await fetch(url)).json();
      const text = answer.district
         ? '<strong>' + answer.district + '</strong>, ' + answer.province +
           '<br>Population: ' + show(answer.pop_2023)
         : 'Not inside any district';
      L.popup().setLatLng(e.latlng).setContent(text).openOn(map);
   });
</script>
</body>
</html>
