<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My First Web GIS</title>
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f4f6f8;
    color: #13293d;
    }
    h1 {
    margin: 0 0 4px;
    color: #0b2545;
    }
    .subtitle {
    color: #5a6b7b;
    margin-top: 0;
    }
    #map {
    height: 480px;
    width: 100%;
    border-radius: 8px;
    }
    </style>
</head>
<body>
    <h1>Islamabad</h1>
    <p class="subtitle">Web GIS, Lab 01. IGIS, NUST.</p>
    <div id="map"></div>
    <script>
        const map = L.map('map').setView([33.6844, 73.0479], 12);
        const cartoDBTiles = 'https://{s}://{z}/{x}/{y}{r}.png';
        const osmTiles = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
        const stadiamaps = 'https://stadiamaps.com{z}/{x}/{y}{r}.png'
        
        L.tileLayer(osmTiles, {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        L.marker([33.718837, 73.023139])
        .addTo(map)
        .bindPopup('D-20, NDU Islamabad', { autoClose: false })
        .openPopup();
       L.circle([33.718837, 73.023139], {
            radius: 2000,
            color: 'red',         // Border color
            fillColor: '#f03',    // Inside fill color
            fillOpacity: 0.3      // Transparency of the fill
        }).addTo(map);
        L.marker([33.6423, 72.9906])
        .addTo(map)
       .bindPopup('NUST H-12, Islamabad', { autoClose: false })
        .openPopup();
         L.circle([33.6423, 72.9906], {
            radius: 2000,
            color: 'blue',         // Border color
            fillColor: 'blue',    // Inside fill color
            fillOpacity: 0.3      // Transparency of the fill
        }).addTo(map);
        </script>
</body>
</html>
