<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>District Explorer</title>

   <link  rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
   <link  rel="stylesheet" href="style.css">
</head>
<body>

<header>
   <h1>District Explorer</h1>
   <p class="subtitle">Districts of Pakistan, shaded by population</p>
</header>

<div id="panel">
   <label for="province">Province</label>
   <select id="province">
      <option value="all">All provinces</option>
   </select>
   <label for="search">District</label>
   <input id="search" type="search" placeholder="Search by name" autocomplete="off">
   <label for="classes">Classes</label>
   <select id="classes">
      <option value="manual">Manual breaks</option>
      <option value="quantile">Quantiles</option>
   </select>
   <span id="count">loading...</span>
</div>

<div id="map"></div>

   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   <script src="app.js"></script>
</body>
</html>
